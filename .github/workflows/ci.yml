name: GlamBot CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast feedback: no database, no services ────────────────────────────────
  validate:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm db:validate

  # ── Unit + integration tests with real Postgres and Redis ─────────────────
  test:
    name: Tests (Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glambot
          POSTGRES_PASSWORD: glambot
          POSTGRES_DB: glambot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U glambot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://glambot:glambot@localhost:5432/glambot_test
      DIRECT_URL: postgresql://glambot:glambot@localhost:5432/glambot_test
      JWT_SECRET: ci-jwt-secret-value-000000
      CREDENTIALS_ENCRYPTION_KEY: ci-encryption-key-000000
      META_VERIFY_TOKEN: ci-verify-token
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Seed test data
        run: pnpm seed

      - name: Unit + integration tests
        run: pnpm --filter api test
        env:
          # Workers are exercised by the E2E job against a live Redis; here we
          # only need the pure logic and the HTTP boundary.
          QUEUE_ENABLED: 'false'

      - name: Runtime smoke test
        run: pnpm smoke
        env:
          QUEUE_ENABLED: 'false'

      - name: Build the widget bundle
        run: pnpm widget:build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: apps/api/coverage
          retention-days: 7

  # ── Browser end-to-end against the real stack ─────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glambot
          POSTGRES_PASSWORD: glambot
          POSTGRES_DB: glambot_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U glambot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://glambot:glambot@localhost:5432/glambot_e2e
      JWT_SECRET: ci-jwt-secret-value-000000
      CREDENTIALS_ENCRYPTION_KEY: ci-encryption-key-000000
      META_VERIFY_TOKEN: ci-verify-token
      REDIS_URL: redis://localhost:6379
      QUEUE_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Start the API in the background
        run: |
          pnpm --filter api build
          pnpm --filter @glambot/widget build
          pnpm --filter api start &
          npx --yes wait-on http://localhost:3000/health --timeout=120000

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Run E2E specs
        run: pnpm e2e
        env:
          E2E_API_URL: http://localhost:3000
          E2E_SALON_URL: http://localhost:5173
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # ── The API image must actually build and boot ────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: glambot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and scrape it
        run: |
          docker run -d --name glambot-ci -p 3000:3000 \
            -e NODE_ENV=production \
            -e JWT_SECRET=ci-jwt-secret-value-000000 \
            -e CREDENTIALS_ENCRYPTION_KEY=ci-encryption-key-000000 \
            -e META_VERIFY_TOKEN=ci-verify-token \
            -e DATABASE_URL=postgresql://glambot:glambot@host.docker.internal:5432/glambot_test \
            glambot-api:ci
          npx --yes wait-on http://localhost:3000/health --timeout=90000
          # The bundle must resolve its dependencies and expose metrics.
          curl -fsS http://localhost:3000/metrics | grep -q glambot_
          docker rm -f glambot-ci


