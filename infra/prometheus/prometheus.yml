# Prometheus scrape configuration for CuraVet.
#
# Scrapes the API's /metrics endpoint. Keep /metrics on a private network in
# production — it exposes tenant identifiers in labels.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: curavet

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: curavet-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: curavet-api
          env: development

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: curavet-otel
          env: development

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
